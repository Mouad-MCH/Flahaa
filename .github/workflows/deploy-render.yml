name: Deploy Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to Render
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_BACKEND_DEPLOY_HOOK" || {
            echo "Missing RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          }

          curl --fail --show-error --silent \
            --request POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Deploy frontend to Render
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_FRONTEND_DEPLOY_HOOK" || {
            echo "Missing RENDER_FRONTEND_DEPLOY_HOOK"
            exit 1
          }

          curl --fail --show-error --silent \
            --request POST "$RENDER_FRONTEND_DEPLOY_HOOK"