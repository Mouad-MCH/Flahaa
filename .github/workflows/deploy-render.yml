name: Deploy Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deployment
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_BACKEND_DEPLOY_HOOK" || {
            echo "Missing GitHub secret: RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          }
          curl --fail --show-error --silent --request POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Trigger frontend deployment
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_FRONTEND_DEPLOY_HOOK" || {
            echo "Missing GitHub secret: RENDER_FRONTEND_DEPLOY_HOOK"
            exit 1
          }
          curl --fail --show-error --silent --request POST "$RENDER_FRONTEND_DEPLOY_HOOK"
