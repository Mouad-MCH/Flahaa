name: CI

on:
  pull_request:
    branches: [master]

  push:
    branches: [master, pipeline-ci]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_STAGE: test
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/flahaa_ci
      JWT_SECRET: ci-jwt-secret-012345678901234567890123
      JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:3030/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Validate Docker builds
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build --tag flahaa-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build --tag flahaa-frontend:ci ./frontend